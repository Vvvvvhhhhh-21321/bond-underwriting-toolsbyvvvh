[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-pdf-scaler"
version = "1.0.0"
description = "披露 PDF 缩放工具"
requires-python = ">=3.11"
dependencies = [
    "pypdf==6.1.1",
    "PySide6==6.9.2",
]

[project.optional-dependencies]
build = ["pyinstaller==6.16.0"]

[project.scripts]
disclosure-pdf-scaler = "disclosure_pdf_scaler.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disclosure_pdf_scaler = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true
disallow_subclassing_any = false
